name: open-tutti-ci

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "packages/agent/borrow/**"
      - "packages/workspace/vm-protocol/**"
      - "packages/workspace/vm-cas/**"
      - "packages/workspace/vm-roomfs/**"
      - "packages/workspace/vm-sync/**"
      - "services/open-tutti-server/**"
      - "services/open-tutti-room-sync/**"
      - "services/open-tutti-fs/**"
      - "go.work"
      - ".github/workflows/open-tutti-ci.yml"
  pull_request:
    paths:
      - "packages/agent/borrow/**"
      - "packages/workspace/vm-protocol/**"
      - "packages/workspace/vm-cas/**"
      - "packages/workspace/vm-roomfs/**"
      - "packages/workspace/vm-sync/**"
      - "services/open-tutti-server/**"
      - "services/open-tutti-room-sync/**"
      - "services/open-tutti-fs/**"
      - "go.work"
      - ".github/workflows/open-tutti-ci.yml"

permissions:
  contents: read

jobs:
  go:
    name: Go workspace (build, vet, test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
          cache: false
      - name: Build
        run: go build github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-server/... github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-room-sync/... github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-fs/... github.com/xiaoheiCat/OpenTuttiVM/packages/agent/borrow/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-protocol/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-roomfs/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-cas/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-sync/...
      - name: Vet
        run: go vet github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-server/... github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-room-sync/... github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-fs/... github.com/xiaoheiCat/OpenTuttiVM/packages/agent/borrow/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-protocol/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-roomfs/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-cas/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-sync/...
      - name: Test
        run: go test github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-server/... github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-room-sync/... github.com/xiaoheiCat/OpenTuttiVM/services/open-tutti-fs/... github.com/xiaoheiCat/OpenTuttiVM/packages/agent/borrow/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-protocol/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-roomfs/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-cas/... github.com/xiaoheiCat/OpenTuttiVM/packages/workspace/vm-sync/...

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l packages/agent/borrow packages/workspace/vm-protocol packages/workspace/vm-roomfs packages/workspace/vm-cas packages/workspace/vm-sync services/open-tutti-server services/open-tutti-room-sync services/open-tutti-fs)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
