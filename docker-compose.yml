# OpenTuttiVM server deployment: the bare collaboration server only.
# Agents NEVER run here — every user's agents run in their own Docker
# Desktop Linux VM; this server is just the meeting room, the source of
# truth for shared state, and the relay for cross-device traffic.
services:
  open-tutti-server:
    build:
      context: .
      dockerfile: services/open-tutti-server/Dockerfile
    restart: unless-stopped
    networks:
      - open-tutti
    # Bridge networking is portable across Docker Desktop and Linux. Keep the
    # host-side publication loopback-only; remote access needs an explicit TLS
    # reverse-proxy override.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPEN_TUTTI_SECRET: ${OPEN_TUTTI_SECRET:?set OPEN_TUTTI_SECRET in .env or the environment}
      OPEN_TUTTI_LISTEN_ADDR: 127.0.0.1:8081
      OPEN_TUTTI_PUBLIC_URL: http://localhost:8080
    env_file:
      - path: ./.env
        required: false
    volumes:
      - open-tutti-data:/data
    # The server remains loopback-only even inside the container. socat is the
    # deliberately dumb container-internal forwarder for Docker's port map.
    command:
      - /bin/sh
      - -c
      - >-
        /usr/local/bin/open-tutti-server & server_pid=$$!;
        trap 'kill $$server_pid 2>/dev/null || true; wait $$server_pid 2>/dev/null || true' TERM INT;
        socat TCP-LISTEN:8080,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:8081;
        status=$$?; kill $$server_pid 2>/dev/null || true;
        wait $$server_pid 2>/dev/null || true; exit $$status

volumes:
  open-tutti-data:

networks:
  open-tutti:
    driver: bridge
