# OpenTuttiVM server deployment: the bare collaboration server only.
# Agents NEVER run here — every user's agents run in their own Docker
# Desktop Linux VM; this server is just the meeting room, the source of
# truth for shared state, and the relay for cross-device traffic.
services:
  open-tutti-server:
    image: ghcr.io/xiaoheicat/open-tutti-server:latest
    # Build locally instead:
    # build:
    #   context: .
    #   dockerfile: services/open-tutti-server/Dockerfile
    restart: unless-stopped
    # Host networking makes the documented loopback listener bind the host's
    # loopback too. A bridge port publish would target the container eth0 and
    # cannot reach a server bound only to 127.0.0.1 inside the container.
    network_mode: host
    env_file:
      - path: ./services/open-tutti-server/.env
        required: false
    # The service .env is the sole deployment override source. Its default
    # listener is loopback, matching the host-only port publication below.
    # Remote deployments should use a separate compose override and HTTPS
    # reverse proxy with an explicit non-loopback listener.
    volumes:
      - open-tutti-data:/data

volumes:
  open-tutti-data:
