# OpenTuttiVM server deployment: the bare collaboration server only.
# Agents NEVER run here — every user's agents run in their own Docker
# Desktop Linux VM; this server is just the meeting room, the source of
# truth for shared state, and the relay for cross-device traffic.
services:
  open-tutti-server:
    image: ghcr.io/xiaoheicat/open-tutti-server:latest
    # Build locally instead:
    # build:
    #   context: .
    #   dockerfile: services/open-tutti-server/Dockerfile
    restart: unless-stopped
    networks:
      - open-tutti
    # Bridge networking is portable across Docker Desktop and Linux. Keep the
    # host-side publication loopback-only; remote access needs an explicit TLS
    # reverse-proxy override.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPEN_TUTTI_LISTEN_ADDR: 0.0.0.0:8080
      OPEN_TUTTI_PUBLIC_URL: http://localhost:8080
      # Docker forwards to the container listener, so the server needs a
      # narrow, Compose-only exception to its plain-HTTP loopback check.
      OPEN_TUTTI_COMPOSE_LOCAL_MODE: "1"
    env_file:
      - path: ./.env
        required: false
    volumes:
      - open-tutti-data:/data

volumes:
  open-tutti-data:

networks:
  open-tutti:
    driver: bridge
